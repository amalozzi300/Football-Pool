{% extends 'base.html' %}

{% block content %}
    <form method="POST" action="{% url 'edit_profile' request.user.username %}" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.non_field_errors }}

        {% for field in form %}
            <div>
                {{ field.label_tag }}
                {{ field }}
                
                {% if field.errors %}
                    <div class="text-danger">
                        {{ field.errors }}
                    </div>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit">Save</button>
    </form>
{% endblock content %}
